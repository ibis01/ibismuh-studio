# Ibismuh Studio gitleaks baseline — added 2026-11-15 (the S128-ext dispatch receipt).
#
# WHY THIS FILE EXISTS: workflow_dispatch runs the secret scan over the FULL
# history (no before/after SHA exists for that event), unlike push (main-only)
# and pull_request (the PR's commit range — 13 commits, "no leaks found", run
# 43630815336). The first dispatched run (CI 43694769530) therefore surfaced 9
# historic findings that the range scans had never seen — every one introduced
# BEFORE the gitleaks gate existed or by prose echoing an earlier finding,
# none in the S124/PAE stack (verified: all 7 introducing commits are ancestors
# of origin/main, none in 37796ce..s124/element-editor).
#
# THE RULE OF THIS FILE: an addition needs a receipt — the finding's
# introducing commit, its file, and why it is historic or a false positive.
# Allowlists are BY COMMIT, so any NEW commit stays scanned under the full
# default ruleset. A deletion needs a re-scan receipt.
#
# Reproduced locally with the exact CI binary (gitleaks 8.24.3, --no-merges
# --first-parent --all, 488 commits): 9 leaks before this file, 0 after.

[extend]
useDefault = true

[allowlist]
description = "the 2026-11-15 dispatch baseline — historic findings, receipt per commit (see the comments)"
