# Ibismuh Studio — full production topology (Stage 3, T-3.12).
#
#   docker compose up -d --build
#
# Roles:
#   ibismuh-postgres  — the source of truth
#   ibismuh-migrate   — ONE-SHOT release migration runner (preflight → lock →
#              migrate → verify). Web and worker wait for its successful
#              completion; the web container NEVER mutates the schema itself
#              (the 2026-11-23 hardening law — see scripts/migrate-release.mjs
#              and DEPLOYMENT.md's release runbook).
#   ibismuh-web       — Next.js standalone server (port 3000) + the in-process
#              queue loop for route-closure jobs (voiceover, render, …)
#   ibismuh-worker    — dedicated durable-queue worker for the DB-derivable heavy
#              stages (script / research / stock). Scale it: `docker compose
#              up -d --scale ibismuh-worker=2`
#
# Storage: default is local disk (volume below). Flip to S3/R2 by setting
# IBISMUH_STUDIO_STORAGE_DRIVER=s3 + the IBISMUH_STUDIO_S3_* block — then the volume is
# only the render scratch and can stay ephemeral.
#
# 2026-11-23 rename note (operator action for stacks provisioned before the
# rename): the services/volumes previously ran as `postgres`/`web`/`worker`
# and volumes `pgdata`/`uploads`. Compose sees the new names as fresh
# resources. To keep existing data: `docker volume rename <project>_pgdata
# <project>_ibismuh_pgdata` and `docker volume rename <project>_uploads
# <project>_ibismuh_uploads` before `up`, or set the POSTGRES_* / DATABASE_URL
# values explicitly and mount the old volumes by path.

services:
  ibismuh-postgres:
    image: postgres:17-alpine
    container_name: ibismuh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ibismuh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ibismuh
    volumes:
      - ibismuh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibismuh -d ibismuh"]
      interval: 5s
      timeout: 3s
      retries: 12

  ibismuh-migrate:
    build: .
    container_name: ibismuh-migrate
    restart: "no"
    depends_on:
      ibismuh-postgres:
        condition: service_healthy
    # The release migration runner: preflight report → durable lock (no
    # concurrent runners) → the proven migrate-stage2 repair/deploy logic →
    # post-deploy verification. The P0.6 42P07 self-heal lives in
    # migrate-stage2.mjs and runs HERE, not in the web container.
    command: node scripts/migrate-release.mjs
    environment:
      DATABASE_URL: postgresql://ibismuh:${POSTGRES_PASSWORD}@ibismuh-postgres:5432/ibismuh

  ibismuh-web:
    build: .
    container_name: ibismuh-web
    restart: unless-stopped
    depends_on:
      ibismuh-postgres:
        condition: service_healthy
      ibismuh-migrate:
        condition: service_completed_successfully
    # Serve ONLY — the schema is the migrate service's job (the hardening
    # law: application startup never mutates the schema).
    command: node .next/standalone/server.js
    environment:
      DATABASE_URL: postgresql://ibismuh:${POSTGRES_PASSWORD}@ibismuh-postgres:5432/ibismuh
      # REQUIRED — generate your own:  openssl rand -base64 32
      IBISMUH_STUDIO_AUTH_SECRET: ${IBISMUH_STUDIO_AUTH_SECRET:-}
      IBISMUH_STUDIO_ENCRYPTION_KEY: ${IBISMUH_STUDIO_ENCRYPTION_KEY:-}
      # Registration gate for legacy installs (see SECURITY.md); optional.
      IBISMUH_STUDIO_OWNER_TOKEN: ${IBISMUH_STUDIO_OWNER_TOKEN:-}
      # Email (console default — set smtp + SMTP_* env for real delivery)
      IBISMUH_STUDIO_EMAIL_MODE: ${IBISMUH_STUDIO_EMAIL_MODE:-}
      IBISMUH_STUDIO_SMTP_HOST: ${IBISMUH_STUDIO_SMTP_HOST:-}
      IBISMUH_STUDIO_SMTP_PORT: ${IBISMUH_STUDIO_SMTP_PORT:-}
      IBISMUH_STUDIO_SMTP_USER: ${IBISMUH_STUDIO_SMTP_USER:-}
      IBISMUH_STUDIO_SMTP_PASS: ${IBISMUH_STUDIO_SMTP_PASS:-}
      IBISMUH_STUDIO_SMTP_FROM: ${IBISMUH_STUDIO_SMTP_FROM:-}
      # Object storage (optional — local volume when unset)
      IBISMUH_STUDIO_STORAGE_DRIVER: ${IBISMUH_STUDIO_STORAGE_DRIVER:-}
      IBISMUH_STUDIO_STORAGE_QUOTA_GB: ${IBISMUH_STUDIO_STORAGE_QUOTA_GB:-}
      IBISMUH_STUDIO_S3_BUCKET: ${IBISMUH_STUDIO_S3_BUCKET:-}
      IBISMUH_STUDIO_S3_REGION: ${IBISMUH_STUDIO_S3_REGION:-}
      IBISMUH_STUDIO_S3_ENDPOINT: ${IBISMUH_STUDIO_S3_ENDPOINT:-}
      IBISMUH_STUDIO_S3_ACCESS_KEY_ID: ${IBISMUH_STUDIO_S3_ACCESS_KEY_ID:-}
      IBISMUH_STUDIO_S3_SECRET_ACCESS_KEY: ${IBISMUH_STUDIO_S3_SECRET_ACCESS_KEY:-}
      # YouTube OAuth (optional at boot; per-user connect works without)
      IBISMUH_STUDIO_YT_CLIENT_ID: ${IBISMUH_STUDIO_YT_CLIENT_ID:-}
      IBISMUH_STUDIO_YT_CLIENT_SECRET: ${IBISMUH_STUDIO_YT_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      - ibismuh_uploads:/app/uploads
    extra_hosts:
      # Claim liveness probes compare PIDs across processes — same-host
      # semantics matter more than network isolation between the roles.
      - "host.docker.internal:host-gateway"
    # M5-F1 (closed 2026-11-23): the web role's liveness, declared at the
    # topology level — the same probe the image HEALTHCHECK carries
    # (Dockerfile: node fetch /api/auth/status). THE BIND LAW (proven by
    # CI run 45266346258): Next standalone binds $HOSTNAME — inside Docker
    # that is the CONTAINER ID (server.js: HOSTNAME || '0.0.0.0'), NOT
    # 127.0.0.1; a loopback probe is connection-refused forever and the
    # image healthcheck was born broken (nothing gated on it until the
    # smoke walk asserted it). Probe HOSTNAME, fall back to loopback for
    # non-Docker runs. The endpoint touches the DB (user count + session
    # resolve), deliberately: a web container that cannot answer its auth
    # status cannot serve, and postgres's own healthcheck disambiguates.
    # node's global fetch — no curl/wget in the runner image.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://'+(process.env.HOSTNAME||'127.0.0.1')+':3000/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  ibismuh-worker:
    build: .
    container_name: ibismuh-worker
    restart: unless-stopped
    depends_on:
      ibismuh-postgres:
        condition: service_healthy
      ibismuh-migrate:
        condition: service_completed_successfully
    command: node --import tsx scripts/worker.mts
    environment:
      DATABASE_URL: postgresql://ibismuh:${POSTGRES_PASSWORD}@ibismuh-postgres:5432/ibismuh
      IBISMUH_STUDIO_AUTH_SECRET: ${IBISMUH_STUDIO_AUTH_SECRET:-}
      IBISMUH_STUDIO_ENCRYPTION_KEY: ${IBISMUH_STUDIO_ENCRYPTION_KEY:-}
      IBISMUH_STUDIO_STORAGE_DRIVER: ${IBISMUH_STUDIO_STORAGE_DRIVER:-}
      IBISMUH_STUDIO_S3_BUCKET: ${IBISMUH_STUDIO_S3_BUCKET:-}
      IBISMUH_STUDIO_S3_REGION: ${IBISMUH_STUDIO_S3_REGION:-}
      IBISMUH_STUDIO_S3_ENDPOINT: ${IBISMUH_STUDIO_S3_ENDPOINT:-}
      IBISMUH_STUDIO_S3_ACCESS_KEY_ID: ${IBISMUH_STUDIO_S3_ACCESS_KEY_ID:-}
      IBISMUH_STUDIO_S3_SECRET_ACCESS_KEY: ${IBISMUH_STUDIO_S3_SECRET_ACCESS_KEY:-}
      # Local storage: share the web container's volume so artifacts written
      # by either role land in the same uploads/ tree.
    volumes:
      - ibismuh_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # M5-F1 (closed 2026-11-23): the worker opens no port, so its probe is
    # the PROCESS check the Dockerfile documents ("the worker overrides
    # with a process check in compose") — scan the container's own PID
    # namespace for the worker process (slim image: no pgrep/ps, but /proc
    # and node are always there). The probe MUST EXCLUDE ITS OWN PID: the
    # -e source contains 'worker.mts', so a naive scan self-matches and
    # reports a dead worker healthy. A wedged claim loop is NOT caught
    # here (the queue's lease/reaper recovery owns that case — proven by
    # the smoke walk's phase 2/3); this check proves the process contract.
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const me=String(process.pid);let ok=false;for(const d of fs.readdirSync('/proc')){if(!/^\\d+$/.test(d)||d===me)continue;try{if(fs.readFileSync('/proc/'+d+'/cmdline','utf8').includes('worker.mts')){ok=true;break}}catch{}}process.exit(ok?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  ibismuh_pgdata:
  ibismuh_uploads:
