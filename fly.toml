# Ibismuh Studio on Fly.io (Stage 3, T-3.12; rebranded from TubeForge) — process-group deployment.
#
#   fly launch --no-deploy --copy-config   (first time)
#   (pre-rebrand apps keep their TUBEFORGE_* secrets — the app mirrors legacy names)
#   fly secrets set IBISMUH_STUDIO_AUTH_SECRET=... IBISMUH_STUDIO_ENCRYPTION_KEY=... \
#                  DATABASE_URL=...  POSTGRES_PASSWORD not needed (Fly Postgres URL)
#   fly deploy
#
# The app is `ibismuh-studio`: the original `tubeforge` app was RENAMED in the
# 2026-11-17 rebrand and the fly.dev hostname followed (tubeforge.fly.dev no
# longer resolves). This config now targets the renamed app so a bare
# `fly deploy` ships to the live deployment instead of failing on a ghost.
#
# primary_region is `lhr` (London) — the nearest Fly region to the operator
# (Hereford, UK). The provisioning default `iad` (US East) put every request
# across the Atlantic. NOTE: `fly deploy` updates EXISTING machines in place
# (they keep their region), so the one-time move to lhr is a deliberate
# operator step — see DEPLOYMENT.md §2.1. Receipt 2026-11-23 (flyctl v0.5.14):
# there is NO `move` command and `machine update` carries no --region flag;
# the supported move is clone-into-region, then destroy the source:
#   fly machine clone <machine-id> --region lhr -a ibismuh-studio -y
#   fly machines destroy <machine-id> -a ibismuh-studio -y   # after the clone answers
#
# Two process groups from ONE image (the Dockerfile default command is web):
#   web    — 2 machines behind the Fly proxy (ports 443/80 → 3000)
#   worker — 1 machine running the durable-queue worker; scale with
#            `fly scale count worker=2 --app <app>`
#
# Storage: Fly machines have EPHEMERAL disks — set the S3 driver
# (IBISMUH_STUDIO_STORAGE_DRIVER=s3 + the IBISMUH_STUDIO_S3_* secrets) or attach a
# persistent volume and mount it at /app/uploads for local storage.

app = "ibismuh-studio"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

# web process group -----------------------------------------------------
[processes]
  web = "node .next/standalone/server.js"
  worker = "node --import tsx scripts/worker.mts"

[[services]]
  processes = ["web"]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "get"
    path = "/api/auth/status"

# machine sizing --------------------------------------------------------
# web: renders happen on the worker, web just serves + runs short closures.
[[vm]]
  processes = ["web"]
  size = "shared-cpu-2x"
  memory = "1gb"

# worker: ffmpeg + AI stage coordination wants headroom.
# The 4 GB is the MEASURED envelope, not a preference (DEPLOYMENT.md §5.3:
# peak RSS 444/442/285 MB per scene at 1080p on a 4 GB worker — 1 GB untested,
# expected to OOM). The S185 config-truth scan pins this file to the §5.3
# number so the two documents cannot drift apart silently again.
# CPU is 2 cores by RECEIPT, not taste: the org's plan caps every machine at
# 2 CPU cores — `fly machine update --vm-cpus 4` was refused 2026-11-22 with
# "Your organization is limited to 2 CPU cores per machine. Please contact
# billing@fly.io" (Request ID 01M82QSTMEWTQFCPJX7Q5FCJYK-lhr). A shared-cpu-4x
# pin here could therefore never apply to a real machine — config fiction of
# exactly the class S185 exists to kill. Renders stay CORRECT at 2 cores
# (memory is the OOM axis); they are CPU-bound-slower. If the org plan is
# ever upgraded, restore size = "shared-cpu-4x" and re-run `fly machine
# update <worker-id> --vm-cpu-kind shared --vm-cpus 4 --vm-memory 4096`.
[[vm]]
  processes = ["worker"]
  size = "shared-cpu-2x"
  memory = "4gb"

# Persistent uploads volume for LOCAL storage mode (optional; S3 mode does
# not need it). Uncomment and `fly volumes create tubeforge_uploads --size 10`.
#
# [[mounts]]
#   processes = ["web", "worker"]
#   source = "tubeforge_uploads"
#   destination = "/app/uploads"
